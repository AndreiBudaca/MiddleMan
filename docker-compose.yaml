services:
  middleman:
    image: andyyy2k/middleman:1.0
    env_file:
      - middleman.env
    environment:
      - ConnectionStrings__Nats=nats:4222
      - ASPNETCORE_HTTP_PORTS=80
    depends_on:
      - nats
    networks:
      - middleman-net
    ports:
      - "80:80"

  nats:
    image: nats:2.11-alpine
    command: "-js"
    networks:
      - middleman-net

networks:
  middleman-net:
    driver: bridge